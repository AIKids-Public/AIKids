<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!-- 404 page only: works out the site's root folder so styles/images load
       from any broken URL, on github.io or on the custom domain. -->
  <script>
    (function () {
      var p = location.pathname.split("/");
      var root = location.hostname.endsWith("github.io") && p[1] ? "/" + p[1] + "/" : "/";
      document.write('<base href="' + root + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- EDITABLE: page title & description (shown in Google and browser tabs) -->
  <title>Page not found — AIKids</title>

  <!-- Social sharing preview -->
  <meta property="og:title" content="AIKids">

  <meta property="og:image" content="images/aikids-logo.png">
  <meta name="theme-color" content="#0b63d6">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Fonts: Poppins (headings) + Nunito (body text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <!-- Marks that JavaScript is on, so fade-in effects don't flash -->
  <script>document.documentElement.classList.add("js");</script>
  <script src="script.js" defer></script>
